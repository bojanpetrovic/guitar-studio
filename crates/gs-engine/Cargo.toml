[package]
name = "gs-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"
truce-rack = { version = "1.1.5", features = ["au", "au3"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
parking_lot = "0.13"
serde_json = "1"
log = "0.4"
base64 = "0.23"

# ASIO drivers on Windows (cpal builds Steinberg's ASIO SDK, used under GPLv3; see
# README "Releases"). Needs CPAL_ASIO_DIR (or downloads the SDK) and LLVM for bindgen.
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString", "NSThread", "NSArray"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSRunningApplication"] }
