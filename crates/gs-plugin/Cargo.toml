[package]
name = "gs-plugin"
description = "Guitar Studio as a VST3 / CLAP plugin, for running the whole rig inside a DAW"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gs_plugin"
crate-type = ["cdylib", "rlib"]

[features]
default = ["vst3", "clap"]
vst3 = ["dep:truce-vst3"]
clap = ["dep:truce-clap", "dep:clap-sys"]

[dependencies]
gs-app = { path = "../gs-app" }
gs-engine = { path = "../gs-engine" }
truce = { version = "6.3.0", default-features = false }
truce-vst3 = { version = "6.3.0", optional = true }
truce-clap = { version = "6.3.0", optional = true }
clap-sys = { version = "0.5", optional = true }
truce-rack = { version = "1.1.5", features = ["au", "au3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
log = "0.4"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
wry = "0.57"
raw-window-handle = "0.6"

[dev-dependencies]
anyhow = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSRunningApplication"] }
