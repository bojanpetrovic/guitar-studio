[package]
name = "guitar-studio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guitar_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
gs-engine = { path = "../crates/gs-engine" }
gs-app = { path = "../crates/gs-app" }
tauri = { version = "2.12", features = ["unstable", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
log = "0.4"
tokio = { version = "1", features = ["net", "sync", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query"] }

[dev-dependencies]
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
