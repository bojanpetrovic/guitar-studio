[workspace]
resolver = "3"
members = ["crates/gs-engine", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.dev.package."*"]
opt-level = 2

# Local fixes to upstream crates (see vendor/README.md).
[patch.crates-io]
truce-rack-vst3 = { path = "vendor/truce-rack-vst3" }
